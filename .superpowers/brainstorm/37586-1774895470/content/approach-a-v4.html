<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DDD — Pretext ASCII Hero v4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #0d0e0f;
    color: #e1ffed;
    font-family: 'IBM Plex Mono', monospace;
    height: 100%;
    overflow: hidden;
  }

  .hero {
    width: 100%; height: 100vh;
    position: relative; overflow: hidden;
  }

  .site-header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 32px;
    background: rgba(13,14,15,0.6);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(225,255,237,0.06);
  }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 50%;
    background: radial-gradient(circle, rgba(225,255,237,0.2), rgba(225,255,237,0.03) 70%);
    border: 1px solid rgba(225,255,237,0.15);
  }
  .site-nav { display: flex; gap: 28px; }
  .site-nav a {
    font: 400 11px/1 'IBM Plex Mono', monospace;
    color: rgba(225,255,237,0.45); text-decoration: none;
    text-transform: uppercase; letter-spacing: 0.1em;
    transition: color 0.2s;
  }
  .site-nav a:hover { color: #e1ffed; }

  #ascii-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.025) 2px, rgba(0,0,0,0.025) 4px);
    pointer-events: none; z-index: 10;
  }

  .demo-badge {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 20;
    font: 400 10px/1.6 'IBM Plex Mono', monospace;
    color: rgba(225,255,237,0.45); text-align: center;
    padding: 8px 20px;
    border: 1px solid rgba(225,255,237,0.1);
    border-radius: 8px;
    background: rgba(13,14,15,0.7);
    backdrop-filter: blur(8px);
  }
  .demo-badge strong { color: #e1ffed; font-weight: 500; }
</style>
</head>
<body>
<div class="hero">
  <header class="site-header">
    <div class="brand-mark"></div>
    <nav class="site-nav">
      <a href="#">Projeto</a><a href="#">Sets</a><a href="#">Data</a><a href="#">Contato</a>
    </nav>
  </header>

  <canvas id="ascii-canvas"></canvas>
  <div class="scanlines"></div>

  <div class="demo-badge">
    <strong>DDD + Pretext</strong> — Variable Typographic ASCII Hero &mdash; Move your mouse
  </div>
</div>

<script>
// ============================================================
// Canvas-rendered ASCII particle hero — 60fps target
// Particle sim in pixel space, brightness field, canvas fillText
// ============================================================

const canvas = document.getElementById('ascii-canvas');
const ctx = canvas.getContext('2d');

const FONT_SIZE = 14;
const LINE_HEIGHT = 16;
const CHAR_W = 8.43;

let COLS, ROWS;
const SIM_W = 320;
let SIM_H;

const PARTICLE_N = 180;
const SPRITE_R = 18;
const ATTRACTOR_R = 16;
const LARGE_ATTRACTOR_R = 40;
const ATTRACTOR_FORCE_1 = 0.22;
const ATTRACTOR_FORCE_2 = 0.06;
const MOUSE_FORCE = 0.30;
const FIELD_DECAY = 0.82;
const FIELD_OVERSAMPLE = 2;

let FIELD_COLS, FIELD_ROWS, FIELD_SCALE_X, FIELD_SCALE_Y;
let brightnessField;
const particles = [];

let mouseSimX = -999, mouseSimY = -999, mouseActive = false;

// Character ramp
const RAMP = ' .,:;!+-=*#@%&';
const RAMP_LEN = RAMP.length;

// DDD logo
const DDD_LOGO = [
  "DDDDDDD      DDDDDDD      DDDDDDD",
  "DD    DD     DD    DD     DD    DD",
  "DD     DD    DD     DD    DD     DD",
  "DD     DD    DD     DD    DD     DD",
  "DD     DD    DD     DD    DD     DD",
  "DD    DD     DD    DD     DD    DD",
  "DDDDDDD      DDDDDDD      DDDDDDD",
];
const DDD_SUB = "D I S C A G E M   D I R E T A   A   D I S T A N C I A";

// Pre-computed font strings for each brightness band
// (avoid string concat in hot loop)
const FONT_BANDS = [
  `300 ${FONT_SIZE}px "IBM Plex Mono",monospace`,         // 0-0.15
  `300 ${FONT_SIZE}px "IBM Plex Mono",monospace`,         // 0.15-0.30
  `italic 300 ${FONT_SIZE}px "IBM Plex Mono",monospace`,  // italic variant
  `500 ${FONT_SIZE}px "IBM Plex Mono",monospace`,         // 0.30-0.55
  `italic 500 ${FONT_SIZE}px "IBM Plex Mono",monospace`,  // italic variant
  `700 ${FONT_SIZE}px "IBM Plex Mono",monospace`,         // 0.55+
  `italic 700 ${FONT_SIZE}px "IBM Plex Mono",monospace`,  // italic variant
];

// Pre-build lookup: brightness byte → { char, fontIdx, alpha }
const lookup = new Array(256);
for (let b = 0; b < 256; b++) {
  const br = b / 255;
  if (br < 0.025) { lookup[b] = null; continue; }
  const ci = Math.min(RAMP_LEN - 1, (br * RAMP_LEN) | 0);
  let fi;
  if (br < 0.15) fi = 0;
  else if (br < 0.30) fi = b % 5 === 0 ? 2 : 1;
  else if (br < 0.55) fi = b % 4 === 0 ? 4 : 3;
  else fi = b % 6 === 0 ? 6 : 5;
  lookup[b] = { char: RAMP[ci], fi, alpha: Math.max(0.06, Math.min(0.95, br * 1.15)) };
}

// Stamp
function spriteAlpha(d) {
  if (d >= 1) return 0;
  return d <= 0.35 ? 0.5 + (0.18 - 0.5) * (d / 0.35) : 0.18 * (1 - (d - 0.35) / 0.65);
}

function createStamp(rpx) {
  const frx = rpx * FIELD_SCALE_X, fry = rpx * FIELD_SCALE_Y;
  const rx = Math.ceil(frx), ry = Math.ceil(fry);
  const sx = rx * 2 + 1, sy = ry * 2 + 1;
  const v = new Float32Array(sx * sy);
  for (let y = -ry; y <= ry; y++)
    for (let x = -rx; x <= rx; x++)
      v[(y + ry) * sx + (x + rx)] = spriteAlpha(Math.sqrt((x / frx) ** 2 + (y / fry) ** 2));
  return { rx, ry, sx, v };
}

function splat(cx, cy, s) {
  const gcx = Math.round(cx * FIELD_SCALE_X), gcy = Math.round(cy * FIELD_SCALE_Y);
  for (let y = -s.ry; y <= s.ry; y++) {
    const gy = gcy + y;
    if (gy < 0 || gy >= FIELD_ROWS) continue;
    const fro = gy * FIELD_COLS, sro = (y + s.ry) * s.sx;
    for (let x = -s.rx; x <= s.rx; x++) {
      const gx = gcx + x;
      if (gx < 0 || gx >= FIELD_COLS) continue;
      const val = s.v[sro + x + s.rx];
      if (val > 0) { const fi = fro + gx; brightnessField[fi] = Math.min(1, brightnessField[fi] + val); }
    }
  }
}

let pStamp, laStamp, saStamp, mStamp;
let dpr = 1;
let logoStartCol, logoStartRow;

function init() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  COLS = Math.floor(w / CHAR_W);
  ROWS = Math.floor(h / LINE_HEIGHT);
  SIM_H = Math.round(SIM_W * (ROWS * LINE_HEIGHT) / (COLS * CHAR_W));

  FIELD_COLS = COLS * FIELD_OVERSAMPLE;
  FIELD_ROWS = ROWS * FIELD_OVERSAMPLE;
  FIELD_SCALE_X = FIELD_COLS / SIM_W;
  FIELD_SCALE_Y = FIELD_ROWS / SIM_H;
  brightnessField = new Float32Array(FIELD_COLS * FIELD_ROWS);

  pStamp = createStamp(SPRITE_R);
  laStamp = createStamp(LARGE_ATTRACTOR_R);
  saStamp = createStamp(ATTRACTOR_R);
  mStamp = createStamp(LARGE_ATTRACTOR_R * 1.3);

  particles.length = 0;
  for (let i = 0; i < PARTICLE_N; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.random() * 60 + 25;
    particles.push({
      x: SIM_W / 2 + Math.cos(a) * r,
      y: SIM_H / 2 + Math.sin(a) * r,
      vx: (Math.random() - 0.5) * 1.0,
      vy: (Math.random() - 0.5) * 1.0,
    });
  }

  logoStartCol = Math.floor((COLS - DDD_LOGO[0].length) / 2);
  logoStartRow = Math.floor((ROWS - DDD_LOGO.length) / 2) - 2;
}

init();
window.addEventListener('resize', init);

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseSimX = ((e.clientX - rect.left) / rect.width) * SIM_W;
  mouseSimY = ((e.clientY - rect.top) / rect.height) * SIM_H;
  mouseActive = true;
});
canvas.addEventListener('mouseleave', () => { mouseActive = false; });

// Batch characters by font to minimize ctx.font switches
function render(now) {
  const w = canvas.width / dpr, h = canvas.height / dpr;

  // Attractors
  const a1x = Math.cos(now * 0.0007) * SIM_W * 0.25 + SIM_W * 0.5;
  const a1y = Math.sin(now * 0.0011) * SIM_H * 0.30 + SIM_H * 0.5;
  const a2x = Math.cos(now * 0.0013 + Math.PI) * SIM_W * 0.20 + SIM_W * 0.5;
  const a2y = Math.sin(now * 0.0009 + Math.PI) * SIM_H * 0.25 + SIM_H * 0.5;

  // Physics
  for (let i = 0; i < PARTICLE_N; i++) {
    const p = particles[i];
    const d1x = a1x - p.x, d1y = a1y - p.y;
    const d2x = a2x - p.x, d2y = a2y - p.y;
    const dist1 = d1x * d1x + d1y * d1y;
    const dist2 = d2x * d2x + d2y * d2y;
    let ax, ay, f;

    if (mouseActive) {
      const dmx = mouseSimX - p.x, dmy = mouseSimY - p.y;
      const distM = dmx * dmx + dmy * dmy;
      if (distM < dist1 && distM < dist2) { ax = dmx; ay = dmy; f = MOUSE_FORCE; }
      else if (dist1 < dist2) { ax = d1x; ay = d1y; f = ATTRACTOR_FORCE_1; }
      else { ax = d2x; ay = d2y; f = ATTRACTOR_FORCE_2; }
    } else {
      if (dist1 < dist2) { ax = d1x; ay = d1y; f = ATTRACTOR_FORCE_1; }
      else { ax = d2x; ay = d2y; f = ATTRACTOR_FORCE_2; }
    }

    const dist = Math.sqrt(ax * ax + ay * ay) + 1;
    p.vx += ax / dist * f;
    p.vy += ay / dist * f;
    p.vx += (Math.random() - 0.5) * 0.25;
    p.vy += (Math.random() - 0.5) * 0.25;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < -SPRITE_R) p.x += SIM_W + SPRITE_R * 2;
    if (p.x > SIM_W + SPRITE_R) p.x -= SIM_W + SPRITE_R * 2;
    if (p.y < -SPRITE_R) p.y += SIM_H + SPRITE_R * 2;
    if (p.y > SIM_H + SPRITE_R) p.y -= SIM_H + SPRITE_R * 2;
  }

  // Field decay
  for (let i = 0, len = brightnessField.length; i < len; i++) brightnessField[i] *= FIELD_DECAY;

  // Splat
  for (let i = 0; i < PARTICLE_N; i++) splat(particles[i].x, particles[i].y, pStamp);
  splat(a1x, a1y, laStamp);
  splat(a2x, a2y, saStamp);
  if (mouseActive) splat(mouseSimX, mouseSimY, mStamp);

  // === Canvas render ===
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.fillStyle = '#0d0e0f';
  ctx.fillRect(0, 0, w, h);
  ctx.textBaseline = 'top';

  // Collect characters into batches by font index to minimize font switches
  // Each batch: { chars: [{x, y, char, alpha}] }
  const batches = [[], [], [], [], [], [], []];

  const invOS2 = 1 / (FIELD_OVERSAMPLE * FIELD_OVERSAMPLE);

  for (let row = 0; row < ROWS; row++) {
    const frs = row * FIELD_OVERSAMPLE * FIELD_COLS;
    const py = row * LINE_HEIGHT;

    for (let col = 0; col < COLS; col++) {
      const fcs = col * FIELD_OVERSAMPLE;
      let b = 0;
      for (let sy = 0; sy < FIELD_OVERSAMPLE; sy++) {
        const sro = frs + sy * FIELD_COLS + fcs;
        for (let sx = 0; sx < FIELD_OVERSAMPLE; sx++) b += brightnessField[sro + sx];
      }
      b *= invOS2;

      // DDD mask
      const lr = row - logoStartRow, lc = col - logoStartCol;
      if (lr >= 0 && lr < 7 && lc >= 0 && lc < DDD_LOGO[lr].length && DDD_LOGO[lr][lc] !== ' ') {
        b = Math.min(1, b + 0.15);
      }
      const subRow = logoStartRow + 9;
      const subStart = Math.floor((COLS - DDD_SUB.length) / 2);
      const sc = col - subStart;
      if (row === subRow && sc >= 0 && sc < DDD_SUB.length && DDD_SUB[sc] !== ' ') {
        b = Math.min(1, b + 0.10);
      }

      const byte = Math.min(255, (b * 255) | 0);
      const entry = lookup[byte];
      if (entry === null) continue;

      batches[entry.fi].push(col * CHAR_W, py, entry.char, entry.alpha);
    }
  }

  // Draw batches
  for (let fi = 0; fi < 7; fi++) {
    const batch = batches[fi];
    if (batch.length === 0) continue;
    ctx.font = FONT_BANDS[fi];

    for (let i = 0; i < batch.length; i += 4) {
      ctx.fillStyle = `rgba(225,255,237,${batch[i + 3].toFixed(2)})`;
      ctx.fillText(batch[i + 2], batch[i], batch[i + 1]);
    }
  }

  ctx.restore();
  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
