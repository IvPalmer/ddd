<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DDD — Pretext ASCII Hero v3</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #171819;
    color: #e1ffed;
    font-family: 'IBM Plex Mono', monospace;
    height: 100%;
    overflow: hidden;
  }

  .hero {
    width: 100%; height: 100vh;
    position: relative; overflow: hidden;
  }

  .site-header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 32px;
    background: rgba(23,24,25,0.5);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(225,255,237,0.08);
  }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 50%;
    background: radial-gradient(circle, rgba(225,255,237,0.25), rgba(225,255,237,0.04) 70%);
    border: 1px solid rgba(225,255,237,0.2);
  }
  .site-nav { display: flex; gap: 28px; }
  .site-nav a {
    font: 400 11px/1 'IBM Plex Mono', monospace;
    color: rgba(225,255,237,0.55); text-decoration: none;
    text-transform: uppercase; letter-spacing: 0.1em;
    transition: color 0.2s;
  }
  .site-nav a:hover { color: #e1ffed; }

  #ascii-output {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 2;
    pointer-events: none;
  }
  .ascii-row {
    white-space: pre;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    line-height: 16px;
    height: 16px;
  }

  /* Weight + style classes */
  .w3 { font-weight: 300; } .w5 { font-weight: 500; } .w7 { font-weight: 700; }
  .it { font-style: italic; }
  .a1  { color: rgba(225,255,237,0.08); }
  .a2  { color: rgba(225,255,237,0.16); }
  .a3  { color: rgba(225,255,237,0.24); }
  .a4  { color: rgba(225,255,237,0.33); }
  .a5  { color: rgba(225,255,237,0.42); }
  .a6  { color: rgba(225,255,237,0.52); }
  .a7  { color: rgba(225,255,237,0.62); }
  .a8  { color: rgba(225,255,237,0.73); }
  .a9  { color: rgba(225,255,237,0.84); }
  .a10 { color: rgba(225,255,237,0.95); text-shadow: 0 0 6px rgba(225,255,237,0.25); }

  .mouse-layer {
    position: absolute; inset: 0; z-index: 1;
    cursor: crosshair;
  }

  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none; z-index: 10;
  }
  .noise {
    position: absolute; inset: 0; opacity: 0.04; pointer-events: none; z-index: 9;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
  }

  .demo-badge {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 20;
    font: 400 10px/1.6 'IBM Plex Mono', monospace;
    color: rgba(225,255,237,0.55); text-align: center;
    padding: 8px 20px;
    border: 1px solid rgba(225,255,237,0.15);
    border-radius: 8px;
    background: rgba(23,24,25,0.7);
    backdrop-filter: blur(8px);
  }
  .demo-badge strong { color: #e1ffed; font-weight: 500; }
</style>
</head>
<body>
<div class="hero">
  <header class="site-header">
    <div class="brand-mark"></div>
    <nav class="site-nav">
      <a href="#">Projeto</a><a href="#">Sets</a><a href="#">Data</a><a href="#">Contato</a>
    </nav>
  </header>

  <div id="ascii-output"></div>
  <div class="mouse-layer" id="mouse-layer"></div>
  <div class="scanlines"></div>
  <div class="noise"></div>

  <div class="demo-badge">
    <strong>Approach A</strong> — Variable Typographic ASCII Hero &mdash; Move your mouse to interact
  </div>
</div>

<script>
// ============================================================
// Faithful adaptation of pretext's variable-typographic-ascii demo
// Particle simulation in PIXEL space, brightness field oversampled,
// then rendered to a character grid filling the viewport
// ============================================================

const FONT_SIZE = 14;
const LINE_HEIGHT = 16;
const CHAR_W = 8.4; // IBM Plex Mono approx char width at 14px

// Grid dimensions (computed from viewport)
let COLS, ROWS;

// Simulation runs in a small pixel canvas (like the original demo)
const SIM_W = 320;
let SIM_H;

const PARTICLE_N = 180;
const SPRITE_R = 18;
const ATTRACTOR_R = 16;
const LARGE_ATTRACTOR_R = 40;
const ATTRACTOR_FORCE_1 = 0.22;
const ATTRACTOR_FORCE_2 = 0.06;
const MOUSE_FORCE = 0.30;
const FIELD_DECAY = 0.82;
const FIELD_OVERSAMPLE = 2;

let FIELD_COLS, FIELD_ROWS;
let FIELD_SCALE_X, FIELD_SCALE_Y;
let brightnessField;

// Particles live in SIM pixel coordinates
const particles = [];

// Mouse in sim coordinates
let mouseSimX = -999, mouseSimY = -999, mouseActive = false;

// DDD text mask
const DDD_LOGO = [
  "DDDDDDD      DDDDDDD      DDDDDDD",
  "DD    DD     DD    DD     DD    DD",
  "DD     DD    DD     DD    DD     DD",
  "DD     DD    DD     DD    DD     DD",
  "DD     DD    DD     DD    DD     DD",
  "DD    DD     DD    DD     DD    DD",
  "DDDDDDD      DDDDDDD      DDDDDDD",
];
const DDD_SUB = "D I S C A G E M   D I R E T A   A   D I S T A N C I A";

// Character ramp sorted by visual density
const CHARSET = ' .,:;!+-=*#@%&';
const CHARSET_LEN = CHARSET.length;

// Pre-build brightness lookup (256 entries)
const brightnessLookup = new Array(256);
for (let b = 0; b < 256; b++) {
  const brightness = b / 255;
  if (brightness < 0.025) {
    brightnessLookup[b] = ' ';
    continue;
  }
  const charIdx = Math.min(CHARSET_LEN - 1, (brightness * CHARSET_LEN) | 0);
  const ch = CHARSET[charIdx];

  let wCls, itCls;
  if (brightness < 0.15) { wCls = 'w3'; itCls = ''; }
  else if (brightness < 0.35) { wCls = 'w3'; itCls = b % 5 === 0 ? ' it' : ''; }
  else if (brightness < 0.55) { wCls = 'w5'; itCls = b % 4 === 0 ? ' it' : ''; }
  else if (brightness < 0.75) { wCls = 'w5'; itCls = b % 3 === 0 ? ' it' : ''; }
  else { wCls = 'w7'; itCls = b % 6 === 0 ? ' it' : ''; }

  const aIdx = Math.max(1, Math.min(10, Math.round(brightness * 10)));
  const escaped = ch === '&' ? '&amp;' : ch;
  brightnessLookup[b] = `<span class="${wCls}${itCls} a${aIdx}">${escaped}</span>`;
}

// Sprite for brightness field stamping
function spriteAlphaAt(d) {
  if (d >= 1) return 0;
  if (d <= 0.35) return 0.5 + (0.18 - 0.5) * (d / 0.35);
  return 0.18 * (1 - (d - 0.35) / 0.65);
}

function createFieldStamp(radiusPx) {
  const frx = radiusPx * FIELD_SCALE_X;
  const fry = radiusPx * FIELD_SCALE_Y;
  const rx = Math.ceil(frx);
  const ry = Math.ceil(fry);
  const sx = rx * 2 + 1;
  const sy = ry * 2 + 1;
  const vals = new Float32Array(sx * sy);
  for (let y = -ry; y <= ry; y++) {
    for (let x = -rx; x <= rx; x++) {
      const d = Math.sqrt((x / frx) ** 2 + (y / fry) ** 2);
      vals[(y + ry) * sx + (x + rx)] = spriteAlphaAt(d);
    }
  }
  return { rx, ry, sx, sy, vals };
}

function splatStamp(cx, cy, stamp) {
  const gcx = Math.round(cx * FIELD_SCALE_X);
  const gcy = Math.round(cy * FIELD_SCALE_Y);
  for (let y = -stamp.ry; y <= stamp.ry; y++) {
    const gy = gcy + y;
    if (gy < 0 || gy >= FIELD_ROWS) continue;
    const fro = gy * FIELD_COLS;
    const sro = (y + stamp.ry) * stamp.sx;
    for (let x = -stamp.rx; x <= stamp.rx; x++) {
      const gx = gcx + x;
      if (gx < 0 || gx >= FIELD_COLS) continue;
      const v = stamp.vals[sro + x + stamp.rx];
      if (v === 0) continue;
      const fi = fro + gx;
      brightnessField[fi] = Math.min(1, brightnessField[fi] + v);
    }
  }
}

let particleStamp, largeAttractorStamp, smallAttractorStamp, mouseStamp;

const output = document.getElementById('ascii-output');
const mouseLayer = document.getElementById('mouse-layer');
const rowNodes = [];

function init() {
  COLS = Math.floor(window.innerWidth / CHAR_W);
  ROWS = Math.floor(window.innerHeight / LINE_HEIGHT);
  SIM_H = Math.round(SIM_W * (ROWS * LINE_HEIGHT) / (COLS * CHAR_W));

  FIELD_COLS = COLS * FIELD_OVERSAMPLE;
  FIELD_ROWS = ROWS * FIELD_OVERSAMPLE;
  FIELD_SCALE_X = FIELD_COLS / SIM_W;
  FIELD_SCALE_Y = FIELD_ROWS / SIM_H;
  brightnessField = new Float32Array(FIELD_COLS * FIELD_ROWS);

  particleStamp = createFieldStamp(SPRITE_R);
  largeAttractorStamp = createFieldStamp(LARGE_ATTRACTOR_R);
  smallAttractorStamp = createFieldStamp(ATTRACTOR_R);
  mouseStamp = createFieldStamp(LARGE_ATTRACTOR_R * 1.3);

  // Init particles in sim pixel space
  particles.length = 0;
  for (let i = 0; i < PARTICLE_N; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = Math.random() * 60 + 25;
    particles.push({
      x: SIM_W / 2 + Math.cos(angle) * r,
      y: SIM_H / 2 + Math.sin(angle) * r,
      vx: (Math.random() - 0.5) * 1.0,
      vy: (Math.random() - 0.5) * 1.0,
    });
  }

  // Create row divs
  output.innerHTML = '';
  rowNodes.length = 0;
  for (let row = 0; row < ROWS; row++) {
    const div = document.createElement('div');
    div.className = 'ascii-row';
    output.appendChild(div);
    rowNodes.push(div);
  }
}

init();
window.addEventListener('resize', init);

mouseLayer.addEventListener('mousemove', (e) => {
  const rect = mouseLayer.getBoundingClientRect();
  const nx = (e.clientX - rect.left) / rect.width;
  const ny = (e.clientY - rect.top) / rect.height;
  mouseSimX = nx * SIM_W;
  mouseSimY = ny * SIM_H;
  mouseActive = true;
});
mouseLayer.addEventListener('mouseleave', () => { mouseActive = false; });

// DDD mask
function getDDDMask(col, row) {
  const logoW = DDD_LOGO[0].length;
  const logoH = DDD_LOGO.length;
  const startCol = Math.floor((COLS - logoW) / 2);
  const startRow = Math.floor((ROWS - logoH) / 2) - 2;
  const lc = col - startCol;
  const lr = row - startRow;

  if (lr >= 0 && lr < logoH && lc >= 0 && lc < DDD_LOGO[lr].length) {
    if (DDD_LOGO[lr][lc] !== ' ') return 0.15;
  }

  const subRow = startRow + logoH + 2;
  const subStartCol = Math.floor((COLS - DDD_SUB.length) / 2);
  const sc = col - subStartCol;
  if (row === subRow && sc >= 0 && sc < DDD_SUB.length && DDD_SUB[sc] !== ' ') {
    return 0.10;
  }
  return 0;
}

function render(now) {
  // Attractor orbits (in sim pixel space)
  const a1x = Math.cos(now * 0.0007) * SIM_W * 0.25 + SIM_W * 0.5;
  const a1y = Math.sin(now * 0.0011) * SIM_H * 0.30 + SIM_H * 0.5;
  const a2x = Math.cos(now * 0.0013 + Math.PI) * SIM_W * 0.20 + SIM_W * 0.5;
  const a2y = Math.sin(now * 0.0009 + Math.PI) * SIM_H * 0.25 + SIM_H * 0.5;

  // Update particles
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    let ax, ay, force;

    const d1x = a1x - p.x, d1y = a1y - p.y;
    const d2x = a2x - p.x, d2y = a2y - p.y;
    const dist1 = d1x * d1x + d1y * d1y;
    const dist2 = d2x * d2x + d2y * d2y;

    if (mouseActive) {
      const dmx = mouseSimX - p.x, dmy = mouseSimY - p.y;
      const distM = dmx * dmx + dmy * dmy;
      if (distM < dist1 && distM < dist2) {
        ax = dmx; ay = dmy; force = MOUSE_FORCE;
      } else if (dist1 < dist2) {
        ax = d1x; ay = d1y; force = ATTRACTOR_FORCE_1;
      } else {
        ax = d2x; ay = d2y; force = ATTRACTOR_FORCE_2;
      }
    } else {
      if (dist1 < dist2) {
        ax = d1x; ay = d1y; force = ATTRACTOR_FORCE_1;
      } else {
        ax = d2x; ay = d2y; force = ATTRACTOR_FORCE_2;
      }
    }

    const dist = Math.sqrt(ax * ax + ay * ay) + 1;
    p.vx += ax / dist * force;
    p.vy += ay / dist * force;
    p.vx += (Math.random() - 0.5) * 0.25;
    p.vy += (Math.random() - 0.5) * 0.25;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.x += p.vx;
    p.y += p.vy;

    if (p.x < -SPRITE_R) p.x += SIM_W + SPRITE_R * 2;
    if (p.x > SIM_W + SPRITE_R) p.x -= SIM_W + SPRITE_R * 2;
    if (p.y < -SPRITE_R) p.y += SIM_H + SPRITE_R * 2;
    if (p.y > SIM_H + SPRITE_R) p.y -= SIM_H + SPRITE_R * 2;
  }

  // Decay brightness field
  for (let i = 0; i < brightnessField.length; i++) {
    brightnessField[i] *= FIELD_DECAY;
  }

  // Splat particles onto field
  for (let i = 0; i < particles.length; i++) {
    splatStamp(particles[i].x, particles[i].y, particleStamp);
  }

  // Splat attractors (bigger glow)
  splatStamp(a1x, a1y, largeAttractorStamp);
  splatStamp(a2x, a2y, smallAttractorStamp);
  if (mouseActive) {
    splatStamp(mouseSimX, mouseSimY, mouseStamp);
  }

  // Sample field → character grid
  for (let row = 0; row < ROWS; row++) {
    let html = '';
    const fieldRowStart = row * FIELD_OVERSAMPLE * FIELD_COLS;

    for (let col = 0; col < COLS; col++) {
      const fieldColStart = col * FIELD_OVERSAMPLE;
      let b = 0;
      for (let sy = 0; sy < FIELD_OVERSAMPLE; sy++) {
        const sro = fieldRowStart + sy * FIELD_COLS + fieldColStart;
        for (let sx = 0; sx < FIELD_OVERSAMPLE; sx++) {
          b += brightnessField[sro + sx];
        }
      }
      b /= (FIELD_OVERSAMPLE * FIELD_OVERSAMPLE);

      // Blend in the DDD text mask
      b = Math.min(1, b + getDDDMask(col, row));

      const byte = Math.min(255, (b * 255) | 0);
      html += brightnessLookup[byte];
    }

    rowNodes[row].innerHTML = html;
  }

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
