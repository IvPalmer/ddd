name: Deploy static site to GitHub Pages

# Mirror only: the VPS Dokploy deploy (ddd.grooveops.dev) is canonical.
# This keeps the GitHub Pages copy at ddd.in.net (see CNAME) in sync with main.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Keep agent and ops docs out of the site
        run: rm -rf AGENTS.md CLAUDE.md RUNTIME.md docs Dockerfile .dockerignore

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
